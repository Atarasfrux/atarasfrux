<style>
.plate-grid {
  padding: clamp(36px, 5vw, 60px) 0 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: clamp(36px, 5vw, 64px) clamp(24px, 3.6vw, 48px);
  align-items: end;
}
.plate-card { margin: 0; }
.plate-card.wide { grid-column: 1 / -1; }
.plate-card.lead-frame {
  grid-column: 1 / -1;
  max-width: 580px;
  justify-self: center;
  width: 100%;
}
.plate-trigger {
  display: block;
  width: 100%;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: zoom-in;
}
.plate-trigger img {
  display: block;
  width: 100%;
  height: auto;
  border: 1px solid var(--rule);
  transition: opacity 0.2s ease;
}
.plate-trigger:hover img { opacity: 0.92; }
.plate-cap {
  margin-top: 10px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-family: var(--mono);
  font-size: 0.67rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.plate-num { color: var(--faint); }

.print-line {
  margin-top: clamp(44px, 6vw, 72px);
  padding-top: 22px;
  border-top: 1px solid var(--rule);
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px 24px;
  font-size: 0.86rem;
  color: var(--muted);
}

/* Borderless Fullscreen Lightbox */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(9, 10, 12, 0.97);
  color: #f2efe8;
  display: none;
  flex-direction: column;
  padding: clamp(16px, 3vw, 32px);
}
.lightbox.open { display: flex; }
.lb-bar, .lb-foot {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 16px;
  font-family: var(--mono);
  font-size: 0.7rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: #a6aab2;
}
.lb-bar { padding-bottom: 12px; border-bottom: 1px solid rgba(242, 239, 232, 0.14); }
.lb-foot { padding-top: 12px; border-top: 1px solid rgba(242, 239, 232, 0.14); }
.lb-controls { display: inline-flex; gap: 10px; }
.lb-btn {
  border: 1px solid rgba(242, 239, 232, 0.28);
  background: transparent;
  color: #f2efe8;
  padding: 5px 12px;
  cursor: pointer;
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.lb-btn:hover { background: #f2efe8; color: #090a0c; }
.lb-stage {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px 0;
}
.lb-stage img {
  max-height: 100%;
  max-width: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
}

@media (max-width: 780px) {
  .plate-grid { grid-template-columns: 1fr; gap: 36px; }
}
</style>
</head>

  </div>
</div>

<script>
(function () {
  var PLATES = [
    { src: "assets/plates_book/01-no-crossing.webp", w: 758, h: 1011, n: "I", en: "No Crossing", lt: "Be perkėlos", no: "Ingen overfart", pt: "Sem travessia", cls: "lead-frame" },
    { src: "assets/plates_book/02-weight.webp", w: 1500, h: 1023, n: "II", en: "Weight", lt: "Svoris", no: "Tyngde", pt: "Peso", cls: "wide" },
    { src: "assets/plates_book/03-restraint.webp", w: 608, h: 769, n: "III", en: "Restraint", lt: "Saitas", no: "Tilbakehold", pt: "Contenção", cls: "" },
    { src: "assets/plates_book/04-the-page.webp", w: 758, h: 966, n: "IV", en: "The Page", lt: "Lapas", no: "Siden", pt: "A página", cls: "" },
    { src: "assets/plates_book/05-tied.webp", w: 1500, h: 1125, n: "V", en: "Tied", lt: "Pririšta", no: "Fortøyd", pt: "Amarrado", cls: "" },
    { src: "assets/plates_book/06-heat.webp", w: 1410, h: 1058, n: "VI", en: "Heat", lt: "Karštis", no: "Hete", pt: "Calor", cls: "" },
    { src: "assets/plates_book/07-low-visibility.webp", w: 1344, h: 1026, n: "VII", en: "Low Visibility", lt: "Nulinis matomumas", no: "Dårlig sikt", pt: "Pouca visibilidade", cls: "wide" },
    { src: "assets/plates_book/10-the-cast.webp", w: 1399, h: 1500, n: "VIII", en: "The Cast", lt: "Metimas", no: "Kastet", pt: "O lançamento", cls: "" },
    { src: "assets/plates_book/21-third-hour.webp", w: 758, h: 1011, n: "IX", en: "Third Hour", lt: "Trečia valanda", no: "Tredje time", pt: "Terceira hora", cls: "" },
    { src: "assets/plates_book/15-afterwards.webp", w: 598, h: 1011, n: "X", en: "Afterwards", lt: "Po visko", no: "Etterpå", pt: "Depois", cls: "" },
    { src: "assets/plates_book/16-wire.webp", w: 602, h: 1011, n: "XI", en: "Wire", lt: "Laidas", no: "Tråd", pt: "Arame", cls: "" },
    { src: "assets/plates_book/17-the-pass.webp", w: 899, h: 575, n: "XII", en: "The Pass", lt: "Perėja", no: "Passet", pt: "O passo", cls: "wide" },
    { src: "assets/plates_book/19-in-passing.webp", w: 853, h: 853, n: "XIII", en: "In Passing", lt: "Praeinant", no: "I forbifarten", pt: "De passagem", cls: "" },
    { src: "assets/plates_book/20-passage.webp", w: 732, h: 717, n: "XIV", en: "Passage", lt: "Perplaukimas", no: "Overfart", pt: "Travessia", cls: "" },
    { src: "assets/plates_book/22-alert.webp", w: 946, h: 710, n: "XV", en: "Alert", lt: "Budriai", no: "Våken", pt: "Alerta", cls: "wide" },
    { src: "assets/plates_book/12-low-tide.webp", w: 1500, h: 938, n: "XVI", en: "Low Tide", lt: "Atoslūgis", no: "Fjære", pt: "Maré baixa", cls: "wide" },
    { src: "assets/plates_book/13-far-lights.webp", w: 758, h: 798, n: "XVII", en: "Far Lights", lt: "Tolimos šviesos", no: "Fjerne lys", pt: "Luzes distantes", cls: "" },
    { src: "assets/plates_book/14-approach.webp", w: 728, h: 880, n: "XVIII", en: "Approach", lt: "Artėjimas", no: "Innseiling", pt: "Aproximação", cls: "" },
    { src: "assets/plates_book/13-witness.webp", w: 927, h: 708, n: "XIX", en: "Witness", lt: "Liudytojas", no: "Vitne", pt: "Testemunha", cls: "" },
    { src: "assets/plates_book/14-through-glass.webp", w: 799, h: 545, n: "XX", en: "Through Glass", lt: "Per stiklą", no: "Gjennom glass", pt: "Através do vidro", cls: "" },
    { src: "assets/plates_book/19-squall.webp", w: 908, h: 600, n: "XXI", en: "Squall", lt: "Škvalas", no: "Vindkule", pt: "Rajada", cls: "wide" },
    { src: "assets/plates_book/08-distance.webp", w: 1154, h: 814, n: "XXII", en: "Distance", lt: "Nuotolis", no: "Avstand", pt: "Distância", cls: "" },
    { src: "assets/plates_book/09-early-frost.webp", w: 796, h: 473, n: "XXIII", en: "Early Frost", lt: "Šerkšnas", no: "Rimfrost", pt: "Primeira geada", cls: "" },
    { src: "assets/plates_book/18-overcast.webp", w: 765, h: 509, n: "XXIV", en: "Overcast", lt: "Debesuota", no: "Overskyet", pt: "Nublado", cls: "" },
    { src: "assets/plates_book/22-outbound.webp", w: 855, h: 491, n: "XXV", en: "Outbound", lt: "Tolstant", no: "Utgående", pt: "De saída", cls: "" },
    { src: "assets/plates_book/24-opening.webp", w: 913, h: 528, n: "XXVI", en: "Opening", lt: "Anga", no: "Åpning", pt: "Abertura", cls: "wide" },
    { src: "assets/plates_book/11-surface.webp", w: 464, h: 652, n: "XXVII", en: "Surface", lt: "Paviršius", no: "Overflate", pt: "Superfície", cls: "" },
    { src: "assets/plates_book/25-late-fruit.webp", w: 752, h: 1011, n: "XXVIII", en: "Late Fruit", lt: "Vėlyvas vaisius", no: "Sen frukt", pt: "Fruto tardio", cls: "" },
    { src: "assets/plates_book/23-one-stem.webp", w: 946, h: 709, n: "XXIX", en: "One Stem", lt: "Vienas stiebas", no: "Én stilk", pt: "Um caule", cls: "wide" }
  ];

  var grid = document.getElementById("plate-grid");
  var capEls = [];
  PLATES.forEach(function (p, i) {
    var fig = document.createElement("figure");
    fig.className = "plate-card" + (p.cls ? " " + p.cls : "");
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "plate-trigger";
    btn.setAttribute("aria-label", "Inspect Plate " + p.n);
    var img = document.createElement("img");
    img.src = p.src;
    img.width = p.w;
    img.height = p.h;
    if (i > 1) img.loading = "lazy";
    img.alt = p.en;
    btn.appendChild(img);
    btn.addEventListener("click", function () { openLightbox(i); });
    var cap = document.createElement("figcaption");
    cap.className = "plate-cap";
    var num = document.createElement("span");
    num.className = "plate-num";
    num.textContent = p.n;
    var title = document.createElement("span");
    title.textContent = p.en;
    cap.appendChild(num);
    cap.appendChild(title);
    fig.appendChild(btn);
    fig.appendChild(cap);
    grid.appendChild(fig);
    capEls.push(title);
  });

  var lb = document.getElementById("lightbox");
  var lbImg = document.getElementById("lb-img");
  var lbCounter = document.getElementById("lb-counter");
  var lbCaption = document.getElementById("lb-caption");
  var activeIdx = 0, lastFocus = null, currentLang = "en";

  function plateTitle(p) {
    return currentLang === "lt" ? p.lt : (currentLang === "no" ? p.no : (currentLang === "pt" ? (p.pt || p.en) : p.en));
  }
  function renderLb(i) {
    activeIdx = (i + PLATES.length) % PLATES.length;
    var p = PLATES[activeIdx];
    lbImg.src = p.src;
    lbImg.alt = plateTitle(p);
    lbCounter.textContent = p.n + " / XXIX";
    lbCaption.textContent = plateTitle(p);
  }
  function openLightbox(i) {
    lastFocus = document.activeElement;
    renderLb(i);
    lb.classList.add("open");
    lb.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    document.getElementById("lb-close").focus();
  }
  function closeLightbox() {
    lb.classList.remove("open");
    lb.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  document.getElementById("lb-prev").addEventListener("click", function () { renderLb(activeIdx - 1); });
  document.getElementById("lb-next").addEventListener("click", function () { renderLb(activeIdx + 1); });
  document.getElementById("lb-close").addEventListener("click", closeLightbox);
  document.getElementById("lb-stage").addEventListener("click", function (e) { if (e.target === e.currentTarget) closeLightbox(); });
  document.addEventListener("keydown", function (e) {
    if (!lb.classList.contains("open")) return;
    if (e.key === "Escape") closeLightbox();
    else if (e.key === "ArrowLeft") renderLb(activeIdx - 1);
    else if (e.key === "ArrowRight") renderLb(activeIdx + 1);
  });

  var LT = {
    page_title: "Fotografija · Mantas Pagalys",
    nav_index: "Rodyklė", nav_dossier: "Bio", nav_mech: "Forma",
    nav_writing: "Rašalas", nav_images: "Objektyvas", nav_archive: "Saugykla", nav_link: "Parama",
    h1: "Fotografija",
    meta_seq: "Plokštelės I&ndash;XXIX",
    meta_film: "Vestiges (Filmas &middot; 02:10) &rarr;",
    print_note: "Archyviniai pigmentiniai atspaudai (numeruotas 10 vnt. tiražas).",
    print_inq: "Tiesioginė užklausa &rarr;",
    lb_close: "Uždaryti"
  };
  var PT = {
  "page_title": "Fotografia · Mantas Pagalys",
  "nav_index": "Índice",
  "nav_dossier": "Bio",
  "nav_mech": "Forma",
  "nav_writing": "Tinta",
  "nav_images": "Lente",
  "nav_archive": "Cofre",
  "nav_link": "Apoio",
  "h1": "Fotografia",
  "meta_seq": "Pranchas I&ndash;XXIX",
  "meta_film": "Vestiges (Filme &middot; 02:10) &rarr;",
  "print_note": "Impressões em pigmento de qualidade arquivística (edição numerada de 10).",
  "print_inq": "Consulta direta &rarr;",
  "lb_close": "Fechar"
};
  var NO = {
    page_title: "Fotografi · Mantas Pagalys",
    nav_index: "Indeks", nav_dossier: "Bio", nav_mech: "Form",
    nav_writing: "Blekk", nav_images: "Linse", nav_archive: "Hvelv", nav_link: "Støtte",
    h1: "Fotografi",
    meta_seq: "Plater I&ndash;XXIX",
    meta_film: "Vestiges (Film &middot; 02:10) &rarr;",
    print_note: "Arkivbestandige pigmenttrykk (nummerert opplag på 10).",
    print_inq: "Direkte forespørsel &rarr;",
    lb_close: "Lukk"
  };
  var nodes = Array.prototype.slice.call(document.querySelectorAll("[data-i18n]"));
  var EN = { page_title: document.title };
  nodes.forEach(function (el) { EN[el.getAttribute("data-i18n")] = el.innerHTML; });
  var btns = Array.prototype.slice.call(document.querySelectorAll(".lang-switch button"));
  var arkaLinks = Array.prototype.slice.call(document.querySelectorAll("[data-arka-link]"));

  function applyLang(lang) {
    currentLang = (lang === "lt" || lang === "no" || lang === "pt") ? lang : "en";
    var dict = currentLang === "lt" ? LT : (currentLang === "no" ? NO : (currentLang === "pt" ? PT : EN));
    document.documentElement.lang = currentLang === "no" ? "nb" : currentLang;
    document.title = dict.page_title || EN.page_title;
    nodes.forEach(function (el) {
      var k = el.getAttribute("data-i18n");
      if (dict[k] !== undefined) el.innerHTML = dict[k];
    });
    PLATES.forEach(function (p, i) { capEls[i].textContent = plateTitle(p); });
    if (lb.classList.contains("open")) renderLb(activeIdx);
    arkaLinks.forEach(function (a) { a.href = currentLang === "no" ? "arka_no.html" : "arka.html"; });
    btns.forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-lang") === currentLang); });
    if (window.greifiksSyncTheme) window.greifiksSyncTheme();
    try { localStorage.setItem("greifiks-lang", currentLang); } catch (e) {}
  }
  btns.forEach(function (b) { b.addEventListener("click", function () { applyLang(b.getAttribute("data-lang")); }); });
  var saved = null;
  try { saved = localStorage.getItem("greifiks-lang"); } catch (e) {}
  applyLang(window.greifiksLang ? window.greifiksLang() : "en");
})();
</script>
<script data-goatcounter="https://mantaspagalys.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
