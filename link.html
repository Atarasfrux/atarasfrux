<style>
body.link-page {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
body.link-page main.wrap {
  width: min(680px, 100%);
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-bottom: clamp(36px, 6vh, 68px);
}
body.link-page .page-head {
  padding: clamp(20px, 3vh, 32px) 0 clamp(20px, 2.8vh, 28px);
}
.form-sheet {
  margin-top: 0;
  padding: clamp(24px, 3.6vh, 36px) 0;
  border-top: 1px solid var(--ink);
  border-bottom: 1px solid var(--ink);
}
.msg-form {
  display: grid;
  gap: 18px;
  max-width: 100%;
}
.msg-form label {
  display: grid;
  gap: 6px;
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}
.msg-form input,
.msg-form textarea {
  width: 100%;
  font: inherit;
  font-family: var(--sans);
  font-size: 0.96rem;
  padding: 11px 12px;
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--rule-strong);
  transition: border-color 0.18s ease;
}
.msg-form input:focus,
.msg-form textarea:focus {
  outline: none;
  border-color: var(--ink);
}
.msg-form textarea {
  resize: vertical;
  min-height: 120px;
}
.msg-form button {
  justify-self: start;
  margin-top: 4px;
}
.support-note {
  margin: 22px 0 0;
  font-size: 0.84rem;
  color: var(--muted);
}
body.link-page footer.colophon {
  margin-top: auto;

<script>
(function () {
  var LT = {
    page_title: "Parama · Mantas Pagalys",
    nav_index: "Rodyklė", nav_dossier: "Bio", nav_mech: "Forma",

  "nav_dossier": "Bio",
  "nav_mech": "Forma",
  "nav_writing": "Tinta",

  "f_msg": "Mensagem",
  "f_send": "Enviar",
  "support_note": "Tudo aqui é aberto. Para impressões, trabalho ou apoio direto, escreva acima."
};
  var NO = {
    page_title: "Støtte · Mantas Pagalys",
    nav_index: "Indeks", nav_dossier: "Bio", nav_mech: "Form",
    nav_writing: "Blekk", nav_images: "Linse", nav_archive: "Hvelv", nav_link: "Støtte",
    h1: "Støtte",

    f_msg: "Melding",
    f_send: "Send",
    support_note: "Alt her er åpent. For trykk, oppdrag eller direkte støtte, skriv over."
  };

  var nodes = Array.prototype.slice.call(document.querySelectorAll("[data-i18n]"));
  var EN = { page_title: document.title };
  nodes.forEach(function (el) { EN[el.getAttribute("data-i18n")] = el.innerHTML; });
  var btns = Array.prototype.slice.call(document.querySelectorAll(".lang-switch button"));

  function applyLang(lang) {
    var l = (lang === "lt" || lang === "no" || lang === "pt") ? lang : "en";
    var dict = l === "lt" ? LT : (l === "no" ? NO : (l === "pt" ? PT : EN));
    document.documentElement.lang = l === "no" ? "nb" : l;
    document.title = dict.page_title || EN.page_title;
    nodes.forEach(function (el) {
      var k = el.getAttribute("data-i18n");
      if (dict[k] !== undefined) el.innerHTML = dict[k];
    });
    btns.forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-lang") === l); });
    if (window.greifiksSyncTheme) window.greifiksSyncTheme();
    try { localStorage.setItem("greifiks-lang", l); } catch (e) {}
  }

  btns.forEach(function (b) { b.addEventListener("click", function () { applyLang(b.getAttribute("data-lang")); }); });
  var saved = null;
  try { saved = localStorage.getItem("greifiks-lang"); } catch (e) {}
  applyLang(window.greifiksLang ? window.greifiksLang() : "en");
})();
</script>
