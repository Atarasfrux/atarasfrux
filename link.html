<script>
(function () {
  window.greifiksI18n({
    lt: {
      page_title: "Atliepk · Mantas Pagalys",
      nav_index: "Rodyklė", nav_dossier: "Bio", nav_mech: "Forma",
      nav_writing: "Rašalas", nav_images: "Objektyvas", nav_archive: "Saugykla", nav_link: "Atliepk",

    },
    pt: {
      page_title: "Apoio · Mantas Pagalys",
      nav_index: "Índice", nav_dossier: "Bio", nav_mech: "Forma",
      nav_writing: "Tinta", nav_images: "Lente", nav_archive: "Cofre", nav_link: "Apoio",
      h1: "Mensagem", f_name: "Nome", f_email: "E-mail", f_msg: "Mensagem", f_send: "Enviar",
      support_note: "Tudo aqui é aberto. Escreva acima para impressões ou trabalho, ou apoie diretamente.",
      support_cta: "Apoio direto &middot; Revolut &nearr;"
    },
    no: {
      page_title: "Støtte · Mantas Pagalys",
      nav_index: "Indeks", nav_dossier: "Bio", nav_mech: "Form",
      nav_writing: "Blekk", nav_images: "Linse", nav_archive: "Hvelv", nav_link: "Støtte",
      h1: "Melding", f_name: "Navn", f_email: "E-post", f_msg: "Melding", f_send: "Send",
      support_note: "Alt her er åpent. Skriv ovenfor for trykk eller oppdrag, eller støtt direkte.",
      support_cta: "Direkte støtte &middot; Revolut &nearr;"
    }
  });

  var sup = document.getElementById("support-link");
  if (sup) sup.addEventListener("click", function () {
    if (window.greifiksTrack) window.greifiksTrack("support/revolut", "Support: Revolut");
  });

  /* Silent session draft memory: if entropy sweeps the page away, returning restores unfinished words */
  var KEY = "greifiks-draft", form = document.getElementById("back-form");
  if (!form) return;
  var fields = ["name", "email", "message"];
  try {
    var raw = sessionStorage.getItem(KEY);
    if (raw) {
      var saved = JSON.parse(raw);
      fields.forEach(function (n) { if (saved[n] && form.elements[n]) form.elements[n].value = saved[n]; });
    }
  } catch (e) {}
  form.addEventListener("input", function () {
    var out = {};
    fields.forEach(function (n) { if (form.elements[n]) out[n] = form.elements[n].value; });
    try { sessionStorage.setItem(KEY, JSON.stringify(out)); } catch (e) {}
  });
  form.addEventListener("submit", function () {
    if (window.greifiksTrack) window.greifiksTrack("contact/sent", "Back message sent");
    try { sessionStorage.removeItem(KEY); } catch (e) {}
  });
})();
</script>
