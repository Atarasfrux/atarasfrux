<script>

  ["contextmenu", "dragstart"].forEach(function (evt) {
    stageWrap.addEventListener(evt, function (e) { e.preventDefault(); });

  function setStatus(txt) {
    if (!txt) { statusMsg.textContent = ""; statusMsg.classList.remove("visible"); }
    else { statusMsg.textContent = txt; statusMsg.classList.add("visible"); }
  }

  function fmt(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    var m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }

  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement || stageWrap.classList.contains("fs-pseudo"));
  }

  function toggleFullscreen() {
    if (stageWrap.classList.contains("fs-pseudo")) {
      if (window.greifiksExitFs) window.greifiksExitFs();
      return;
    }
    if (isFullscreen()) {
      var ex = document.exitFullscreen || document.webkitExitFullscreen;
      if (ex) { try { ex.call(document); } catch (e) {} }
    } else {
      var req = stageWrap.requestFullscreen || stageWrap.webkitRequestFullscreen;
      if (req) {
        try {
          var p = req.call(stageWrap);
          if (p && typeof p.catch === "function") p.catch(function () {});
        } catch (e) {}
      } else if (video.webkitEnterFullscreen) {
        try { video.webkitEnterFullscreen(); } catch (e) {}
      }
    }
  }

  function syncLabels() {
    var lt = currentLang === "lt", no = currentLang === "no", pt = currentLang === "pt";
    btnPlay.textContent = video.paused ? (lt ? "Groti" : (no ? "Spill" : (pt ? "Reproduzir" : "Play"))) : (lt ? "Pauzė" : (pt ? "Pausar" : "Pause"));
    btnMute.textContent = video.muted ? (lt ? "Tyla" : (no ? "Dempet" : (pt ? "Sem som" : "Muted"))) : (lt ? "Garsas" : (no ? "Lyd" : (pt ? "Som" : "Sound")));
    btnFs.textContent = isFullscreen() ? (lt ? "Maukt" : (no ? "Avslutt" : (pt ? "Sair" : "Exit"))) : (lt ? "Visas ekr." : (no ? "Fullskjerm" : (pt ? "Tela cheia" : "Fullscreen")));
    stage.classList.toggle("playing", !video.paused && !video.ended);
  }

  function updateProgress() {
    var dur = (isFinite(video.duration) && video.duration > 1) ? video.duration : totalDur;
    var cur = video.currentTime || 0;
    scrubFill.style.width = Math.max(0, Math.min(100, (cur / dur) * 100)).toFixed(2) + "%";
    scrub.setAttribute("aria-valuemax", String(Math.round(dur)));
    scrub.setAttribute("aria-valuenow", String(Math.round(cur)));
    timeRead.textContent = fmt(cur) + " / " + fmt(dur);
    if (video.buffered && video.buffered.length > 0) {
      var bend = video.buffered.end(video.buffered.length - 1);
      scrubBuf.style.width = Math.max(0, Math.min(100, (bend / dur) * 100)).toFixed(2) + "%";
    }
  }

  function parseM3U8(text) {
    var initUri = "init.mp4", segs = [], durSum = 0;
    text.split(/\r?\n/).forEach(function (line) {
      var l = line.trim();
      if (l.indexOf("#EXT-X-MAP:") === 0) {
        var m = l.match(/URI="([^"]+)"/);
        if (m) initUri = m[1];
      } else if (l.indexOf("#EXTINF:") === 0) {
        var d = parseFloat(l.slice(8));
        if (isFinite(d)) durSum += d;
      } else if (l && l.charAt(0) !== "#") {
        segs.push(l);
      }
    });
    return { initUri: initUri, segs: segs, duration: durSum || FALLBACK_DUR };
  }

  function startStreamAndPlay() {
    if (streamStarted) {
      if (video.paused) video.play().catch(function () {});
      else video.pause();
      return;
    }
    if (window.location.protocol === "file:") {
      setStatus(currentLang === "lt" ? "Atidarykite per HTTP arba greifiks.org." : (currentLang === "no" ? "Åpne via HTTP eller https://greifiks.org." : (currentLang === "pt" ? "Abra via HTTP ou https://greifiks.org." : "Open over HTTP or https://greifiks.org.")));
      return;
    }
    streamStarted = true;
    if (window.greifiksTrack) window.greifiksTrack("play/vestiges", "Play: Vestiges");
    setStatus(currentLang === "lt" ? "Kraunama..." : (currentLang === "no" ? "Laster..." : (currentLang === "pt" ? "Carregando..." : "Loading...")));

    var MSE = window.MediaSource || window.ManagedMediaSource;
    var canMSE = MSE && typeof MSE.isTypeSupported === "function" && MSE.isTypeSupported(MIME);

    if (!canMSE && video.canPlayType && video.canPlayType("application/vnd.apple.mpegurl")) {
      video.src = MANIFEST;
      video.addEventListener("loadedmetadata", function () { streamReady = true; setStatus(""); updateProgress(); }, { once: true });
      video.play().then(function () { setStatus(""); }).catch(function () {});
      return;
    }
    if (!canMSE) { setStatus(currentLang === "lt" ? "Nepalaikoma naršyklė." : (currentLang === "no" ? "Nettleseren støttes ikke." : (currentLang === "pt" ? "Navegador não compatível." : "Unsupported browser."))); streamStarted = false; return; }

    fetch(MANIFEST).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.text();
    }).then(function (txt) {
      var parsed = parseM3U8(txt);
      totalDur = parsed.duration;
      var ms = new MSE();
      var objUrl = URL.createObjectURL(ms);
      video.src = objUrl;

      ms.addEventListener("sourceopen", function () {

        try { ms.duration = totalDur; } catch (e) {}
        var sb = ms.addSourceBuffer(MIME);
        var queue = [parsed.initUri].concat(parsed.segs);

            return;
          }
          fetch(BASE + queue[idx]).then(function (resp) {
            if (!resp.ok) throw new Error(resp.status);
            return resp.arrayBuffer();
          }).then(function (buf) {
            function doAppend() {
              try { sb.appendBuffer(buf); }
              catch (err) {
                if (err && err.name === "QuotaExceededError") setTimeout(doAppend, 600);
                else setStatus(currentLang === "lt" ? "Srauto klaida." : (currentLang === "no" ? "Strømfeil." : (currentLang === "pt" ? "Erro no fluxo." : "Stream error.")));
              }
            }
            doAppend();
          }).catch(function () { setStatus(currentLang === "lt" ? "Srautas nutrūko." : (currentLang === "no" ? "Strømmen ble avbrutt." : (currentLang === "pt" ? "Fluxo interrompido." : "Stream interrupted."))); });
        }

        sb.addEventListener("updateend", function () {
          updateProgress();
          if (idx === 1 && !streamReady) {
            streamReady = true;
            setStatus("");
            video.play().catch(function () {});
          }
          idx += 1;
          appendNext();
        });
        appendNext();
      }, { once: true });
    }).catch(function () { streamStarted = false; setStatus(currentLang === "lt" ? "Srautas nepasiekiamas." : (currentLang === "no" ? "Strøm utilgjengelig." : (currentLang === "pt" ? "Fluxo indisponível." : "Stream unavailable."))); });
  }

  function togglePlay() {
    if (!streamStarted) { startStreamAndPlay(); return; }
    if (video.paused || video.ended) video.play().catch(function () {});
    else video.pause();
  }

  stage.addEventListener("click", function (e) { e.preventDefault(); togglePlay(); });
  stage.addEventListener("dblclick", function (e) { e.preventDefault(); toggleFullscreen(); });
  bigPlay.addEventListener("click", function (e) { e.stopPropagation(); togglePlay(); });
  btnPlay.addEventListener("click", togglePlay);
  btnMute.addEventListener("click", function () { video.muted = !video.muted; syncLabels(); });
  btnFs.addEventListener("click", toggleFullscreen);
  document.addEventListener("fullscreenchange", syncLabels);
  document.addEventListener("webkitfullscreenchange", syncLabels);
  document.addEventListener("greifiks-fs-change", syncLabels);

  scrub.addEventListener("click", function (e) {
    if (!streamStarted) return;
    var rect = scrub.getBoundingClientRect();
    var ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / Math.max(1, rect.width)));
    var dur = (isFinite(video.duration) && video.duration > 1) ? video.duration : totalDur;
    var target = ratio * dur;
    if (video.buffered && video.buffered.length > 0) {
      var maxBuf = video.buffered.end(video.buffered.length - 1);

    updateProgress();

    if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;

  });
  ["play", "pause", "ended", "volumechange"].forEach(function (ev) { video.addEventListener(ev, syncLabels); });
  video.addEventListener("timeupdate", updateProgress);
  video.addEventListener("progress", updateProgress);

    page_title: "Vestiges de ce qui s’est tu · Mantas Pagalys",
    nav_index: "Rodyklė", nav_dossier: "Bio", nav_mech: "Forma",

  "nav_writing": "Tinta",

  "meta_strip": "<span>02:10</span><span>1920&times;1080</span><span>dezembro de 2026</span>",
  "btn_screen": "Reproduzir &middot; 02:10",
  "policy_txt": "Cópia de exibição (02:10). Proibida a redistribuição. <a href=\"link.html\">Aviso</a> para créditos ou remoção."
};

  var NO = {
    page_title: "Vestiges de ce qui s’est tu · Mantas Pagalys",
    nav_index: "Indeks", nav_dossier: "Bio", nav_mech: "Form",
    nav_writing: "Blekk", nav_images: "Linse", nav_archive: "Hvelv", nav_link: "Gjensvar",
    meta_strip: "<span>02:10</span><span>1920&times;1080</span><span>desember 2026</span>",
    btn_screen: "Spill &middot; 02:10",
    policy_txt: "Visningskopi (02:10). Ikke til videredistribusjon. <a href=\"link.html\">Melding</a> ved spørsmål om kreditering eller fjerning."
  };

  if (window.greifiksI18n) window.greifiksI18n({
