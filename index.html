<style>
body.index-page {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
body.index-page main.wrap {
  width: min(600px, 100%);
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.index-sheet {
  /* more space below than above: lifts the list to the optical centre (~45 %) */
  padding: 0 0 clamp(40px, 10vh, 120px);
}
/* header on the same column as the list, so the name sits above the numerals */
body.index-page .site-nav .wrap { width: min(600px, 100%); padding-inline: clamp(20px, 4vw, 48px); }

/* Pure catalog framed ONLY by matching top & bottom white rules (no inner separators) */
.catalog {
  border-top: 1px solid var(--ink);
  border-bottom: 1px solid var(--ink);
  margin: 0;
  padding: 12px 0;
  list-style: none;
}
.catalog li > a,
.catalog .cat-row {
  display: grid;
  grid-template-columns: 36px minmax(0, 1fr) auto 20px;
  align-items: baseline;
  gap: 8px 18px;
  padding: 15px 0;
  text-decoration: none;
  transition: padding-left 0.2s ease;
}
.catalog li > a:hover,
.catalog li > a:focus-visible {
  padding-left: 6px;
}
.cat-row-main {
  grid-column: 1 / 3;
  display: grid;
  grid-template-columns: 36px minmax(0, 1fr);
  align-items: baseline;
  gap: 8px 18px;
  text-decoration: none;
  transition: padding-left 0.2s ease;
}
.cat-row-main:hover,
.cat-row-main:focus-visible {
  padding-left: 6px;
}
.cat-num {
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.14em;
  color: var(--faint);
}
.cat-title {
  font-family: var(--serif-display);
  font-variation-settings: "opsz" 14;
  font-size: clamp(1.28rem, 2.3vw, 1.56rem);
  font-weight: 400;
  line-height: 1.2;
  color: var(--ink);
}
.cat-meta {
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: right;
  white-space: nowrap;
}
.cat-sublinks {
  display: inline-flex;
  align-items: baseline;
  gap: 10px;
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
}
.cat-sublinks a {
  text-decoration: none;
  color: var(--muted);
  border-bottom: 1px solid transparent;
  padding-bottom: 2px;
  transition: color 0.18s ease, border-color 0.18s ease;
}
.cat-sublinks a:hover,
.cat-sublinks a:focus-visible {
  color: var(--ink);
  border-bottom-color: var(--ink);
}
.cat-sublinks .sub-sep { color: var(--faint); }
.cat-arr {
  font-size: 0.92rem;
  color: var(--faint);
  text-align: right;
  text-decoration: none;
  transition: transform 0.2s ease, color 0.2s ease;
}
.catalog li > a:hover .cat-arr,
.cat-row:hover .cat-arr {
  color: var(--ink);
  transform: translate(2px, -2px);
}

body.index-page footer.colophon {
  margin-top: auto;
  padding: 18px 0 26px;
}

@media (max-width: 640px) {
  body.index-page main.wrap { justify-content: flex-start; }
  .index-sheet { padding-top: 28px; }
  .catalog li > a,
  .catalog .cat-row {
    grid-template-columns: 28px minmax(0, 1fr) 18px;
    padding: 13px 0;
  }
  .cat-row-main {
    grid-template-columns: 28px minmax(0, 1fr);
  }
  .cat-meta,
  .cat-sublinks {
    grid-column: 2;
    text-align: left;
    justify-self: start;
    margin-top: 2px;
  }
  .cat-arr { grid-row: 1; grid-column: 3; }
}
</style>
</head>
<body class="index-page">

<header class="site-nav">
  <div class="wrap nav-inner">

      <li>

          <span class="cat-title" data-i18n="c3_t">Ink</span>
          <span class="cat-meta" data-i18n="c3_m">Antinovel&#279; &middot; Fragments</span>
          <span class="cat-arr" aria-hidden="true">&#8599;</span>
        </a>
      </li>
      <li>

          <span class="cat-sublinks">

</main>

<footer class="colophon">
  <div class="wrap colophon-inner">
    <div>greifiks.org 2026</div>
  </div>

<script>
(function () {
  var LT = {
    page_title: "Mantas Pagalys",
    nav_index: "Rodyklė",
    c1_t: "Bio",
    c1_m: "2006&ndash;2026",
    c2_t: "Forma",
    c2_m: "Mechanika ir karkasas",
    c3_t: "Rašalas",
    c3_m: "Antinovelė &middot; Fragmentai",
    c4_t: "Objektyvas",
    c4_s1: "Kadrai",
    c4_s2: "Filmas",
    c5_t: "Saugykla",
    c5_m: "ARKA",
    c6_t: "Parama",
    c6_m: "Žinutė &middot; Parama"
  };

  var NO = {
    page_title: "Mantas Pagalys",
    nav_index: "Indeks",
    c1_t: "Bio",
    c1_m: "2006&ndash;2026",
    c2_t: "Form",
    c2_m: "Mekanikk og rammeverk",
    c3_t: "Blekk",
    c3_m: "Antinovelė &middot; Fragmenter",
    c4_t: "Linse",
    c4_s1: "Stillbilder",
    c4_s2: "Film",
    c5_t: "Hvelv",
    c5_m: "ARKA",
    c6_t: "Støtte",
    c6_m: "Melding &middot; Støtte"
  };

  var PT = {
    page_title: "Mantas Pagalys",
    nav_index: "Índice",
    c1_t: "Bio",
    c1_m: "2006&ndash;2026",
    c2_t: "Forma",
    c2_m: "Mecânica &amp; Estrutura",
    c3_t: "Tinta",
    c3_m: "Antinovel&#279; &middot; Fragmentos",
    c4_t: "Lente",
    c4_s1: "Fotos",
    c4_s2: "Filme",
    c5_t: "Cofre",
    c5_m: "ARKA",
    c6_t: "Apoio",
    c6_m: "Mensagem &middot; Apoio"
  };

  var nodes = Array.prototype.slice.call(document.querySelectorAll("[data-i18n]"));
  var EN = { page_title: document.title };
  nodes.forEach(function (el) { EN[el.getAttribute("data-i18n")] = el.innerHTML; });
  var btns = Array.prototype.slice.call(document.querySelectorAll(".lang-switch button"));

  function applyLang(lang) {
    var l = (lang === "lt" || lang === "no" || lang === "pt") ? lang : "en";
    var dict = l === "lt" ? LT : (l === "no" ? NO : (l === "pt" ? PT : EN));
    document.documentElement.lang = l === "no" ? "nb" : l;
    document.title = dict.page_title || EN.page_title;
    nodes.forEach(function (el) {
      var k = el.getAttribute("data-i18n");
      if (dict[k] !== undefined) el.innerHTML = dict[k];
    });
    btns.forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-lang") === l); });
    if (window.greifiksSyncTheme) window.greifiksSyncTheme();
    try { localStorage.setItem("greifiks-lang", l); } catch (e) {}
  }

  btns.forEach(function (b) { b.addEventListener("click", function () { applyLang(b.getAttribute("data-lang")); }); });
  var saved = null;
  try { saved = localStorage.getItem("greifiks-lang"); } catch (e) {}
  applyLang(window.greifiksLang ? window.greifiksLang() : ((saved === "lt" || saved === "no" || saved === "pt") ? saved : "en"));
})();
</script>
<script data-goatcounter="https://mantaspagalys.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
