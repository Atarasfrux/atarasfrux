<style>
html { --bg: #000; --ink: #f2efe8; --dim: rgba(242,239,232,0.42); }
html[data-theme="light"] { --bg: #fff; --ink: #0a0a0a; --dim: rgba(10,10,10,0.42); }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); }
body { -webkit-font-smoothing: antialiased; }
canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
#ink { pointer-events: none; }

.ui, .ui button {
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: 0.66rem; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--dim); background: none; border: 0; padding: 4px 6px; margin: 0;
  cursor: pointer; text-decoration: none;
}
.ui button.active, .ui button:hover, .ui a:hover { color: var(--ink); }
.ui button:focus-visible, .ui a:focus-visible, main a:focus-visible { outline: 1px solid var(--dim); outline-offset: 3px; }

.th-dark  { position: fixed; top: 20px; left: 24px; z-index: 3; }
.th-light { position: fixed; top: 20px; right: 24px; z-index: 3; }
.foot  { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 3; }

main {
  position: fixed; inset: 0; z-index: 2;
  display: flex; align-items: center; justify-content: center;
}
main ul { list-style: none; margin: 0; padding: 0; text-align: center; }
main li { margin: 0 0 clamp(10px, 2.2vh, 22px); }
main li:last-child { margin-bottom: 0; }
.t {
  display: inline-block; text-decoration: none; color: var(--ink);
  font-family: "Cinzel", Georgia, serif; font-weight: 400;
  letter-spacing: 0.08em; text-transform: uppercase;
  font-size: clamp(1.7rem, min(5.4vh, 5.2vw), 3.1rem); line-height: 1.08;

.s {
  display: table; margin: 4px auto 0;
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: 0.64rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim);
}
.s a { color: var(--dim); text-decoration: none; }

/* live mode: the canvas draws the words, the DOM keeps only the click targets */
html.live main, html.live .isle, html.live .isle * { color: transparent !important; user-select: none; pointer-events: none; }
html.live .isle.on a, html.live .isle.on button, html.live button.isle.on { pointer-events: auto; }
.s span.dw { margin: 0 0.55em; }
html.still canvas { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  var Lx = -0.40, Ly = -0.60, Lz = 0.69, lLen = Math.sqrt(Lx * Lx + Ly * Ly + Lz * Lz);

  function initGL() {

      var ctx = fab.getContext("webgl2", { alpha: false, antialias: false, depth: false, stencil: false, preserveDrawingBuffer: false, powerPreference: "low-power" });
      if (!ctx) return false;
      var vsSrc = "#version 300 es\nout vec2 v_uv;\nvoid main(){vec2 p=vec2(gl_VertexID==1?3.0:-1.0,gl_VertexID==2?3.0:-1.0);v_uv=vec2(0.5*(p.x+1.0),0.5*(1.0-p.y));gl_Position=vec4(p,0.0,1.0);}";
      /* Ultra-light 4-tap R16F hardware-bilinear shader with C2 quintic UV filter (9x less GPU work than 4x4 bicubic) */
      var fsSrc = [
        "#version 300 es",
        "precision highp float;",
        "uniform sampler2D u_h;",
        "uniform vec2 u_grid;",
        "uniform vec4 u_well;",
        "uniform vec4 u_hv;",
        "uniform float u_light;",
        "in vec2 v_uv;",
        "out vec4 outCol;",
        "void main(){",
        "  vec2 px = 1.0 / u_grid;",
        "  vec2 p = v_uv * u_grid - 0.5;",
        "  vec2 fp = fract(p);",
        "  vec2 qf = fp * fp * fp * (fp * (fp * 6.0 - 15.0) + 10.0);",
        "  vec2 uv = (floor(p) + qf + 0.5) * px;",
        "  float hL = texture(u_h, uv - vec2(px.x, 0.0)).r;",
        "  float hR = texture(u_h, uv + vec2(px.x, 0.0)).r;",
        "  float hU = texture(u_h, uv - vec2(0.0, px.y)).r;",
        "  float hD = texture(u_h, uv + vec2(0.0, px.y)).r;",
        "  float h = 0.25 * (hL + hR + hU + hD);",
        "  float gx = hR - hL;",
        "  float gy = hD - hU;",
        "  float D = u_well.z, R = u_well.w;",
        "  if (D > 0.001) {",
        "    vec2 d = v_uv * u_grid - u_well.xy;",
        "    float r2 = dot(d, d), R2 = R * R;",
        "    if (r2 < R2 * 22.0) {",
        "      float q2 = r2 + R2, q = sqrt(q2), fac = 2.0 * D * R / (q * q2);",
        "      gx += fac * d.x; gy += fac * d.y; h -= D * R / q;",
        "    }",
        "  }",
        "  vec3 n = normalize(vec3(-gx * 3.2, -gy * 3.2, 1.0));",
        "  float Hz = u_hv.z, inv1 = u_hv.w;",
        "  float ndh = dot(n, u_hv.xyz);",
        "  float rim = max(0.0, 1.0 - n.z);",
        "  float rimP = rim * 0.36 + sqrt(rim) * 0.64;",
        "  if (u_light < 0.5) {",
        "    float su = max(0.0, (ndh - Hz) * inv1);",
        "    float ndh2 = -n.x * u_hv.x - n.y * u_hv.y + n.z * Hz;",
        "    float su2 = max(0.0, (ndh2 - Hz) * inv1);",
        "    float raw = su * su * 460.0 + su * 165.0 + su2 * su2 * 32.0 + rimP * 135.0;",
        "    float t = (242.0 * raw / (165.0 + raw)) / 255.0;",
        "    float sky = su * su * 0.14;",
        "    vec3 col = vec3(t * 0.88 + sky, t * (0.31 + 0.24 * t) + sky * 0.82, t * (0.05 + 0.13 * t * t) + sky * 0.52);",
        "    outCol = vec4(clamp(col, 0.0, 1.0), 1.0);",
        "  } else {",
        "    float sd = max(0.0, (Hz - ndh) * inv1);",
        "    float suL = max(0.0, (ndh - Hz) * inv1);",
        "    float sdP = sd * (0.90 * sqrt(sd) + 0.10 * sd);",
        "    float raw = sdP * 280.0 + rimP * 130.0;",
        "    float sh = clamp((205.0 * raw / (155.0 + raw) - suL * suL * 24.0 - h * 5.0) / 255.0, 0.0, 0.85);",
        "    outCol = vec4(clamp(vec3(1.0 - sh * 0.56, 0.997 - sh * 0.78, 0.988 - sh * 0.92), 0.0, 1.0), 1.0);",
        "  }",
        "}"
      ].join("\n");
      function sh(type, srcText) {
        var s = ctx.createShader(type); ctx.shaderSource(s, srcText); ctx.compileShader(s);
        if (!ctx.getShaderParameter(s, ctx.COMPILE_STATUS)) { ctx.deleteShader(s); return null; }

      }

      if (!vs || !fs) return false;

      if (!ctx.getProgramParameter(pr, ctx.LINK_STATUS)) return false;
      ctx.useProgram(pr);
      glVao = ctx.createVertexArray(); ctx.bindVertexArray(glVao);
      glTex = ctx.createTexture(); ctx.activeTexture(ctx.TEXTURE0); ctx.bindTexture(ctx.TEXTURE_2D, glTex);

      ctx.texParameteri(ctx.TEXTURE_2D, ctx.TEXTURE_MAG_FILTER, ctx.LINEAR);

        well: ctx.getUniformLocation(pr, "u_well"),

    var nf = fab.cloneNode(false); fab.parentNode.replaceChild(nf, fab); fab = nf;

  /* Precomputed 256-entry 32-bit RGBA palettes for 2D fallback (endian-safe) */
  var isLE = new Uint8Array(new Uint32Array([1]).buffer)[0] === 1;
  function packRGBA(r, g, b) {
    return isLE ? ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0 : ((r << 24) | (g << 16) | (b << 8) | 255) >>> 0;
  }
  var palDark = new Uint32Array(256), palLight = new Uint32Array(256);
  for (var pv = 0; pv < 256; pv++) {
    var pt = pv / 255;
    palDark[pv] = packRGBA(
      Math.min(255, (pt * 0.90 * 255) | 0),
      Math.min(255, (pt * (0.31 + 0.25 * pt) * 255) | 0),
      Math.min(255, (pt * (0.05 + 0.14 * pt * pt) * 255) | 0)
    );
    var psh = 1 - pt;
    palLight[pv] = packRGBA(
      Math.max(0, Math.min(255, ((1 - psh * 0.56) * 255) | 0)),
      Math.max(0, Math.min(255, ((0.997 - psh * 0.78) * 255) | 0)),
      Math.max(0, Math.min(255, ((0.988 - psh * 0.92) * 255) | 0))
    );
  }

  function wake() { if (!rafId) { lastNow = 0; warmFrames = 0; rafId = requestAnimationFrame(frame); } }

  function fillFlat() {
    var light = root.getAttribute("data-theme") === "light";
    if (gl) {
      gl.clearColor(light ? 1 : 0, light ? 0.997 : 0, light ? 0.988 : 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
    } else if (fctx) {
      u32.fill(light ? palLight[255] : palDark[0]);
      fctx.putImageData(img, 0, 0);
    }
    if (inkDirty) { ictx.clearRect(dL, dT, dR - dL, dB - dT); inkDirty = false; }
  }

  function resize(extraStep) {
    dpr = Math.min(window.devicePixelRatio || 1, lowTier ? 1.5 : 2);
    vw = window.innerWidth; vh = window.innerHeight;
    var targetCells = lowTier ? 52000 : 88000;
    C = Math.max(lowTier ? 6 : 5, Math.round(Math.sqrt(vw * vh / targetCells))) + (extraStep || 0);
    W = Math.ceil(vw / C) + 2; H = Math.ceil(vh / C) + 2;
    cur = new Float32Array(W * H); prev = new Float32Array(W * H); nxt = new Float32Array(W * H); ren = new Float32Array(W * H);

    sponge = new Float32Array(W * H);
    var M = Math.max(10, Math.round(64 / C));
    for (var y = 0; y < H; y++) {
      var dy = y < H - 1 - y ? y : H - 1 - y;
      for (var x = 0; x < W; x++) {
        var dx = x < W - 1 - x ? x : W - 1 - x;

      fab.width = vw; fab.height = vh;
      gl.viewport(0, 0, fab.width, fab.height);
      gl.bindTexture(gl.TEXTURE_2D, glTex);

    fillFlat();
  }

  function cssVar(n) { return getComputedStyle(root).getPropertyValue(n).trim(); }

  /* paint the six titles (at their real DOM positions) into an offscreen canvas */
  function drawSrc() {
    if (!src.width) return;

    sctx.setTransform(1, 0, 0, 1, 0, 0); sctx.clearRect(0, 0, src.width, src.height);
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    [].forEach.call(document.querySelectorAll(".dw"), function (el) {

    [].forEach.call(document.querySelectorAll(".isle"), function (li, k) {
      var L = 1e9, T = 1e9, Rr = -1e9, B = -1e9;
      var leaves = li.classList.contains("dw") ? [li] : li.querySelectorAll(".dw");
      [].forEach.call(leaves, function (el) {
        var r = el.getBoundingClientRect();
        L = Math.min(L, r.left); T = Math.min(T, r.top); Rr = Math.max(Rr, r.right); B = Math.max(B, r.bottom);
      });

      groups.push({ li: li, sec: li.tagName === "LI", idx: li.id === "indexBtn", l: L, t: T - 6, r: Rr, b: B + 6, cx: (L + Rr) / 2, cy: (T + B) / 2, vis: o.vis, up: o.up, entHold: o.entHold || 0, seed: k * 1.7 });
    });

  /* Smooth C2 cosine-squared viscous press (CSS-pixel consistent across any adaptive grid C) */
  function poke(x, y, amt, rad) {
    var r = Math.max(3, rad * (4 / C));
    var cx = x / C, cy = y / C, r0 = Math.ceil(r);
    var ix0 = Math.round(cx), iy0 = Math.round(cy);
    for (var j = -r0; j <= r0; j++) {
      var Y = iy0 + j; if (Y < 1 || Y >= H - 1) continue;
      var dy = Y - cy;
      for (var i = -r0; i <= r0; i++) {

      }

    wake();
  }
  function lift(x, y, amt, rad) { poke(x, y, -amt, rad); }

  function ent() { return window.greifiksEntropy; }
  function move(x, y) {
    if (ent()) return;
    touchUntil = 0;
    if (mx < 0) { wx = x; wy = y; }
    mx = x; my = y; depthT = 1;
    if (lx >= 0) {

  window.addEventListener("mousemove", function (e) { move(e.clientX, e.clientY); }, { passive: true });

  function target(n) { var a = n && n.closest && n.closest("a, button"); return a && a.closest(".isle") ? a : null; }

  var STEP = 1000 / 60;
  /* 9-point isotropic Mehrstellen Laplacian + Kelvin-Voigt viscosity + absorbing sponge boundary */
  function stepWave(damp, rest, entR, entAmp) {
    var c2 = 0.68, visc = 0.062;
    var cx0 = W * 0.5, cy0 = H * 0.5;
    var hasRing = entAmp > 0.0001;
    var rMin = Math.max(0, entR - 8), rMax = entR + 8;
    var rMin2 = rMin * rMin, rMax2 = rMax * rMax;
    for (var y = 1; y < H - 1; y++) {
      var row = y * W, dy = y - cy0, dy2 = dy * dy;
      for (var x = 1, i = row + 1; x < W - 1; x++, i++) {
        var lapC = 0.2 * (cur[i - 1] + cur[i + 1] + cur[i - W] + cur[i + W])
                 + 0.05 * (cur[i - W - 1] + cur[i - W + 1] + cur[i + W - 1] + cur[i + W + 1])
                 - cur[i];
        var lapP = 0.2 * (prev[i - 1] + prev[i + 1] + prev[i - W] + prev[i + W])
                 + 0.05 * (prev[i - W - 1] + prev[i - W + 1] + prev[i + W - 1] + prev[i + W + 1])
                 - prev[i];
        var nv = (cur[i] + (cur[i] - prev[i]) * damp + c2 * lapC + visc * (lapC - lapP)) * rest * sponge[i];
        if (hasRing) {
          var dx = x - cx0, r2 = dx * dx + dy2;
          if (r2 > rMin2 && r2 < rMax2) {
            /* Zero-mean traveling circular dipole (leading crest + trailing trough): real wave energy, zero DC sinkhole */
            var u = (Math.sqrt(r2) - entR) / 2.6;
            nv += entAmp * u * Math.exp(-0.5 * u * u);
          }
        }
        nxt[i] = nv;
      }
    }
    var tmp = prev; prev = cur; cur = nxt; nxt = tmp;
  }

  function shadeField(D, R, gcx, gcy, light) {
    var R2 = R * R, wellR2 = R2 * 20, DR2 = 2 * D * R, DR = D * R;
    var pal = light ? palLight : palDark;
    var flatPx = light ? palLight[255] : palDark[0];
    var y, x, i;
    for (y = 0; y < H; y++) {
      var dy = y - gcy, dy2 = dy * dy;
      var inWellY = D > 0.001 && dy2 < wellR2;
      var yu0 = y > 0 ? y - 1 : 0, yd0 = y < H - 1 ? y + 1 : H - 1;
      var row = y * W, rowU = yu0 * W, rowD = yd0 * W;
      for (x = 0; x < W; x++) {
        var xl0 = x > 0 ? x - 1 : 0, xr0 = x < W - 1 ? x + 1 : W - 1;
        i = row + x;
        var gx = 0.5 * (ren[row + xr0] - ren[row + xl0])
               + 0.25 * (ren[rowU + xr0] - ren[rowU + xl0] + ren[rowD + xr0] - ren[rowD + xl0]);
        var gy = 0.5 * (ren[rowD + x] - ren[rowU + x])
               + 0.25 * (ren[rowD + xl0] - ren[rowU + xl0] + ren[rowD + xr0] - ren[rowU + xr0]);
        var h = ren[i];
        if (inWellY) {
          var dx = x - gcx, r2 = dx * dx + dy2;
          if (r2 < wellR2) {
            var q2 = r2 + R2, q = Math.sqrt(q2), f = DR2 / (q * q2);
            gx += f * dx; gy += f * dy; h -= DR / q;
          }
        }
        /* Fast flat-pixel exit: zero sqrt/lighting on calm tar */
        if (gx > -0.0012 && gx < 0.0012 && gy > -0.0012 && gy < 0.0012 && (!light || (h > -0.04 && h < 0.04))) {
          u32[i] = flatPx;
          continue;
        }
        var sx = -gx * 3.2, sy = -gy * 3.2;
        var invL = 1 / Math.sqrt(1 + sx * sx + sy * sy);
        var nx = sx * invL, ny = sy * invL, nz = invL;
        var ndh = nx * Hx + ny * Hy + nz * Hz;
        var rim = 1 - nz, rimP = rim * 0.36 + Math.sqrt(rim) * 0.64, raw, v;
        if (!light) {
          var su = ndh > Hz ? (ndh - Hz) * invOneMinusHz : 0;
          var ndh2 = -nx * Hx - ny * Hy + nz * Hz;
          var su2 = ndh2 > Hz ? (ndh2 - Hz) * invOneMinusHz : 0;
          raw = su * su * 460 + su * 165 + su2 * su2 * 32 + rimP * 135;
          v = (246 * raw / (165 + raw)) | 0;
          u32[i] = pal[v > 255 ? 255 : v];
        } else {
          var sd = ndh < Hz ? (Hz - ndh) * invOneMinusHz : 0;
          var suL = ndh > Hz ? (ndh - Hz) * invOneMinusHz : 0;
          var sdP = sd > 0 ? sd * (0.90 * Math.sqrt(sd) + 0.10 * sd) : 0;
          raw = sdP * 280 + rimP * 130;
          v = (255 - (205 * raw / (155 + raw)) + suL * suL * 24 + h * 5) | 0;

  }

  function renderFabric(D, R, gcx, gcy, light) {
    if (gl) {
      gl.bindTexture(gl.TEXTURE_2D, glTex);
      gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, W, H, gl.RED, gl.FLOAT, ren);
      gl.uniform4f(glU.well, gcx, gcy, D, R);
      gl.uniform1f(glU.light, light ? 1 : 0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    } else if (fctx) {
      shadeField(D, R, gcx, gcy, light);
      fctx.putImageData(img, 0, 0);
    }
  }

  function frame(now) {
    rafId = 0;
    var rawDt = lastNow ? Math.max(0, now - lastNow) : STEP;
    /* Automatic slow-device governor: if sustained frame time > 26 ms (<38 fps), step grid down once */
    if (!perfScaled && warmFrames > 10 && lastNow) {
      if (rawDt > 26) {
        if (++perfSlow >= 18) { perfScaled = true; resize(1); wake(); return; }
      } else if (perfSlow > 0) perfSlow--;
    }

    if (rawDt > 15.0 && rawDt < 18.4) rawDt = STEP;

    var dt = warmFrames < 4 ? Math.min(STEP, rawDt || STEP) : Math.min(34, rawDt);

    var tail = ep > 0.78 ? (ep - 0.78) / 0.22 : 0;
    var damp = E ? 0.989 - tail * tail * 0.095 : 0.989;
    var rest = E ? 0.999 - tail * tail * 0.085 : 0.999;
    var light = root.getAttribute("data-theme") === "light";

    /* Expanding circular entropy wavefront (center -> outer corners over ep 0..0.78, calm settle 0.78..1.0) */
    var Rmax = Math.hypot(W * 0.5, H * 0.5) + 8;
    var ew = E ? Math.min(1, ep / 0.78) : 0;
    var entR = E ? Rmax * (ew * ew * (3 - 2 * ew)) : -1;
    var dEntR = E ? Math.max(0, entR - lastEntR) : 0;
    if (E) lastEntR = entR;
    /* Velocity-compensated wave drive -> consistent realistic ripple height at any duration */
    var entAmp = E && ew < 1 ? 0.048 * Math.min(1.4, Math.sqrt(Math.max(0.08, dEntR))) * Math.sin(Math.PI * ew) : 0;

    /* 1. fixed-timestep isotropic liquid wave + sub-frame temporal interpolation */
    var steps = 0;
    while (stepAcc >= STEP && steps < 2) {
      stepWave(damp, rest, entR, entAmp);
      stepAcc -= STEP;
      steps++;
    }
    var alpha = Math.min(1, stepAcc / STEP), invA = 1 - alpha;
    for (i = 0; i < cur.length; i++) {
      var ci = cur[i], pi = prev[i];
      ren[i] = pi * invA + ci * alpha;
      var av = (ci < 0 ? -ci : ci) + (pi < 0 ? -pi : pi);
      if (av > maxWave) maxWave = av;
    }

    /* 2. gravity well follows pointer slowly like heavy oil */
    var kDt = dt / STEP;
    wx += (mx - wx) * Math.min(1, 0.055 * kDt); wy += (my - wy) * Math.min(1, 0.055 * kDt);
    depth += (depthT - depth) * Math.min(1, 0.032 * kDt); boost *= Math.pow(0.965, kDt);
    var D = depth * (1.35 + (held ? 0.55 : 0) + boost * 0.85), R = (96 / C) + (held ? 20 / C : 0) + boost * (24 / C);
    var gcx = wx / C, gcy = wy / C;

    /* 3. GPU WebGL2 4-tap R16F liquid shader (or fast 2D fallback) */
    renderFabric(D, R, gcx, gcy, light);

    /* 4. islands: wave-resonant emergence and exact mirror-symmetric fade / entropy submersion */
    energy *= Math.pow(0.988, kDt); vel *= Math.pow(0.91, kDt);
    var global = focusIn ? 1 : Math.min(1, energy);
    var reach = 175 + boost * 65;
    var dist = pinned ? vel * 0.28 : vel;
    var w = ink.width, ih = ink.height, S = Math.max(2, Math.round(3 * dpr));
    var any = false;
    if (inkDirty) { ictx.clearRect(dL, dT, dR - dL, dB - dT); inkDirty = false; }
    var nL = w, nT = ih, nR = 0, nB = 0;
    for (var g = 0; g < groups.length; g++) {
      var G = groups[g], tg;
      if (E) {
        var gr = Math.hypot(G.cx / C - W * 0.5, G.cy / C - H * 0.5);
        tg = entR < gr - 3 ? G.entHold : 0;
      } else {
        var ddx = Math.max(G.l - wx, 0, wx - G.r), ddy = Math.max(G.t - wy, 0, wy - G.b);
        var near = mx < 0 ? 0 : depth * Math.max(0, 1 - Math.sqrt(ddx * ddx + ddy * ddy) / reach);
        var isHot = hovered && G.li.contains(hovered);
        var gl = G.sec ? Math.max(global, pinned ? 1 : 0) : (focusIn ? 1 : (G.idx && pinned ? 1 : 0));
        tg = Math.max(gl, Math.min(1, near * 1.6), isHot ? 1 : 0);
      }
      /* Symmetric rise / fade pace matched to liquid wave decay */
      var rate = tg > G.vis ? 0.062 : (E ? 0.042 : 0.052);
      G.vis += (tg - G.vis) * Math.min(1, rate * kDt);
      /* Exact mirror meniscus rings: +lift at 0.25 rising, -poke at 0.75 sinking */
      if (!G.up && tg > 0.5 && G.vis > 0.25) {
        G.up = true;
        lift(G.cx, G.cy, 0.72, 8);
      } else if (G.up && tg < 0.5 && G.vis < 0.75) {
        G.up = false;
        poke(G.cx, G.cy, 0.72, 8);
      } else if (G.up && G.vis < 0.12) {
        G.up = false;
      }
      G.li.classList.toggle("on", !E && (G.vis > 0.35 || focusIn));
      if (G.vis < 0.004) continue;
      any = true;
      var v = G.vis, e = 1 - v;
      /* Symmetric meniscus transition factor: peaks at v=0.5 identically during emergence (0->1) and fade/collapse (1->0) */
      var tr = 4 * v * e;
      var nearNow = E || mx < 0 ? 0 : depth * Math.max(0, 1 - Math.hypot(Math.max(G.l - wx, 0, wx - G.r), Math.max(G.t - wy, 0, wy - G.b)) / reach);
      var rise = e * e * 38 * dpr + Math.sin(t * 1.0 + G.seed) * 1.1 * dpr * v;
      var pull = (E || mx < 0 ? 0 : (wx - G.cx) * 0.04 * nearNow) * dpr;
      var top = Math.max(0, Math.floor(G.t * dpr / S) * S), bot = Math.min(ih, G.b * dpr);
      var pad = 12 * dpr, sx0 = Math.max(0, G.l * dpr - pad), sw = Math.min(w, G.r * dpr + pad) - sx0;
      var gxc = Math.max(1, Math.min(W - 2, (G.cx / C) | 0));
      var dPadX = 64 * dpr, dPadY = 56 * dpr;
      if (sx0 - dPadX < nL) nL = Math.max(0, Math.floor(sx0 - dPadX));
      if (top - dPadY < nT) nT = Math.max(0, Math.floor(top - dPadY));
      if (sx0 + sw + dPadX > nR) nR = Math.min(w, Math.ceil(sx0 + sw + dPadX));
      if (bot + dPadY > nB) nB = Math.min(ih, Math.ceil(bot + dPadY));
      /* Single-blit fast path when chapter is fully surfaced and resting on calm tar */
      var midWi = Math.max(1, Math.min(H - 2, (G.cy / C) | 0)) * W + gxc;
      var calmLocal = maxWave < 0.015 || (Math.abs(ren[midWi]) < 0.015 && Math.abs(ren[midWi + 1] - ren[midWi - 1]) + Math.abs(ren[midWi + W] - ren[midWi - W]) < 0.02);
      if (v > 0.992 && dist < 0.015 && nearNow < 0.02 && calmLocal) {
        ictx.globalAlpha = 1;
        ictx.drawImage(src, sx0, top, sw, bot - top, sx0, top + rise, sw, bot - top);
      } else {
        for (var sy = top; sy < bot; sy += S) {
          var n = (Math.sin(sy * 12.9898 + G.seed) * 43758.5453) % 1; if (n < 0) n += 1;
          if (n > v * 1.25) continue;
          var gyr = Math.max(1, Math.min(H - 2, (sy / dpr / C) | 0));
          var wi = gyr * W + gxc;
          var wave = ren[wi];
          var wslope = Math.abs(ren[wi + 1] - ren[wi - 1]) + Math.abs(ren[wi + W] - ren[wi - W]);
          var gd = Math.min(1, Math.max(dist, nearNow * 0.10, tr * 0.42, wslope * 0.55));
          var hh = Math.max(1, S * (1 - gd * 0.58));
          var gw = sw + w * gd * 0.036;
          var ox = pull + (gd * (Math.sin(sy * 0.02 / dpr + t * 2.2) * 20 + Math.sin(sy * 0.11 / dpr - t * 4.5) * 7) + wave * 4.8) * dpr;
          var oy = rise - wave * 5.2 * dpr;
          ictx.globalAlpha = v;
          ictx.drawImage(src, sx0, sy, sw, S, sx0 + ox, sy + oy, sw, hh);
          if (gd > 0.06) {
            ictx.globalAlpha = v * gd * 0.34;
            ictx.drawImage(src, sx0, sy, sw, S, sx0 - (gw - sw) / 2 + ox * 1.8, sy + oy, gw, hh);
          }
        }
      }
    }
    if (any) { inkDirty = true; dL = nL; dT = nT; dR = nR; dB = nB; }
    ictx.globalAlpha = 1;

    /* true mathematical equilibrium sleep: zero CPU when flat and quiet, zero change to any visible frame */
    if (maxWave > 0.0008 || depth > 0.0005 || depthT > 0 || boost > 0.0005 || energy > 0.0005 || vel > 0.0005 || any || E || pinned || focusIn || touchUntil) {
      rafId = requestAnimationFrame(frame);
    } else {
      cur.fill(0); prev.fill(0); nxt.fill(0); ren.fill(0); fillFlat();
    }
  }

  resize();
  /* Pre-warm JIT silently while surface is flat black, wait for fonts + settled compositor, then drop entry breath */
  var booted = false;
  function launchBreath() {
    if (booted) return;
    booted = true;
    drawSrc();
    if (!ent() && mx < 0 && !pinned) {
      /* Silent JIT + GPU shader pipeline warmup while screen is flat black */
      var isLight = root.getAttribute("data-theme") === "light";
      var mid = (H >> 1) * W + (W >> 1);
      cur[mid] = -0.6;
      for (var wk = 0; wk < 3; wk++) {
        stepWave(0.989, 0.999, -1, 0);
        for (var wi0 = 0; wi0 < cur.length; wi0++) ren[wi0] = cur[wi0];
        if (!gl) shadeField(1, 24, W * 0.5, H * 0.5, isLight);
      }
      cur.fill(0); prev.fill(0); nxt.fill(0); ren.fill(0);
      /* Warm GPU shader program on zero field (paints pure flat black/white while compiling driver pipeline) */
      if (gl) renderFabric(0, 24, W * 0.5, H * 0.5, isLight);
      fillFlat();
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          if (!ent() && mx < 0 && !pinned) {
            poke(vw / 2, vh / 2, 1.25, 7);
            lift(vw / 2, vh / 2, 0.25, 13);
          }
        });
      });
    }
  }
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { if (booted) drawSrc(); else setTimeout(launchBreath, 120); });
    setTimeout(launchBreath, 550);
  } else {
    setTimeout(launchBreath, 300);
  }
})();
