<style>
body.hub-page {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
body.hub-page main.wrap {
  width: min(680px, 100%);
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-bottom: clamp(44px, 7vh, 84px);
}
body.hub-page .page-head {
  padding: 0 0 clamp(22px, 3vh, 32px);
}
.hub-list {
  margin: 0;
  padding: 12px 0;
  list-style: none;
  border-top: 1px solid var(--ink);
  border-bottom: 1px solid var(--ink);
}
.hub-list a {
  display: grid;
  grid-template-columns: 36px minmax(0, 1fr) auto 20px;
  align-items: baseline;
  gap: 8px 18px;
  padding: 18px 0;
  text-decoration: none;
  transition: padding-left 0.2s ease;
}
.hub-list a:hover,
.hub-list a:focus-visible {
  padding-left: 6px;
}
.cat-num {
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.14em;
  color: var(--faint);
}
.cat-title {
  font-family: var(--serif-display);
  font-variation-settings: "opsz" 14;
  font-size: clamp(1.28rem, 2.3vw, 1.56rem);
  font-weight: 400;
  line-height: 1.2;
  color: var(--ink);
}
.cat-meta {
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: right;
  white-space: nowrap;
}
.cat-arr {
  font-size: 0.92rem;
  color: var(--faint);
  text-align: right;
  transition: transform 0.2s ease, color 0.2s ease;
}
.hub-list a:hover .cat-arr {
  color: var(--ink);
  transform: translate(2px, -2px);
}
body.hub-page footer.colophon {
  margin-top: auto;
  padding: 20px 0 28px;
}
@media (max-width: 640px) {
  .hub-list a { grid-template-columns: 28px minmax(0, 1fr) 18px; padding: 14px 0; }
  .cat-meta { grid-column: 2; text-align: left; margin-top: 2px; }
  .cat-arr { grid-row: 1; grid-column: 3; }
}
</style>
</head>

<script>
(function () {
  var LT = {
    page_title: "Saugykla · Mantas Pagalys",
    nav_index: "Rodyklė", nav_dossier: "Bio", nav_mech: "Forma",
    nav_writing: "Rašalas", nav_images: "Objektyvas", nav_archive: "Saugykla", nav_link: "Parama",
    h1: "Saugykla",
    a1_m: "Būsto modelis &middot; 2026"
  };
  var PT = {
  "page_title": "Cofre · Mantas Pagalys",
  "nav_index": "Índice",
  "nav_dossier": "Bio",
  "nav_mech": "Forma",
  "nav_writing": "Tinta",
  "nav_images": "Lente",
  "nav_archive": "Cofre",
  "nav_link": "Apoio",
  "h1": "Cofre",
  "a1_m": "Modelo habitacional &middot; 2026"
};
  var NO = {
    page_title: "Hvelv · Mantas Pagalys",
    nav_index: "Indeks", nav_dossier: "Bio", nav_mech: "Form",
    nav_writing: "Blekk", nav_images: "Linse", nav_archive: "Hvelv", nav_link: "Støtte",
    h1: "Hvelv",
    a1_m: "Boligmodell &middot; 2026"
  };

  var nodes = Array.prototype.slice.call(document.querySelectorAll("[data-i18n]"));
  var EN = { page_title: document.title };
  nodes.forEach(function (el) { EN[el.getAttribute("data-i18n")] = el.innerHTML; });
  var btns = Array.prototype.slice.call(document.querySelectorAll(".lang-switch button"));
  var arkaLink = document.getElementById("arka-link");

  function applyLang(lang) {
    var l = (lang === "lt" || lang === "no" || lang === "pt") ? lang : "en";
    var dict = l === "lt" ? LT : (l === "no" ? NO : (l === "pt" ? PT : EN));
    document.documentElement.lang = l === "no" ? "nb" : l;
    document.title = dict.page_title || EN.page_title;
    nodes.forEach(function (el) {
      var k = el.getAttribute("data-i18n");
      if (dict[k] !== undefined) el.innerHTML = dict[k];
    });
    if (arkaLink) arkaLink.href = l === "no" ? "arka_no.html" : "arka.html";
    btns.forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-lang") === l); });
    if (window.greifiksSyncTheme) window.greifiksSyncTheme();
    try { localStorage.setItem("greifiks-lang", l); } catch (e) {}
  }

  btns.forEach(function (b) { b.addEventListener("click", function () { applyLang(b.getAttribute("data-lang")); }); });
  var saved = null;
  try { saved = localStorage.getItem("greifiks-lang"); } catch (e) {}
  applyLang(window.greifiksLang ? window.greifiksLang() : "en");
})();
</script>
